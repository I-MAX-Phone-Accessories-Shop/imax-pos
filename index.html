<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMAS POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Primary - Light Blue
              primary: {
                50: "#F0F9FF",
                100: "#E0F2FE",
                200: "#BAE6FD",
                300: "#7DD3FC",
                400: "#38BDF8",
                500: "#0EA5E9",
                600: "#0284C7",
                700: "#0369A1",
                800: "#075985",
                900: "#0C4A6E",
                950: "#082F49",
                DEFAULT: "#0EA5E9",
              },
              // Dark - Black/Gray (from IMAS logo)
              dark: {
                50: "#F9FAFB",
                100: "#F3F4F6",
                200: "#E5E7EB",
                300: "#D1D5DB",
                400: "#9CA3AF",
                500: "#6B7280",
                600: "#4B5563",
                700: "#374151",
                800: "#1F2937",
                900: "#111827",
                950: "#030712",
                DEFAULT: "#111827",
              },
              // Button colors
              btn: {
                primary: "#0EA5E9",
                "primary-hover": "#0284C7",
                secondary: "#111827",
                "secondary-hover": "#1F2937",
                danger: "#EF4444",
                "danger-hover": "#DC2626",
                success: "#22C55E",
                "success-hover": "#16A34A",
              },
              // Status colors
              status: {
                success: "#22C55E",
                warning: "#F59E0B",
                error: "#EF4444",
                info: "#0EA5E9",
              },
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
            boxShadow: {
              glow: "0 0 20px rgba(14, 165, 233, 0.3)",
              "glow-sm": "0 0 10px rgba(14, 165, 233, 0.2)",
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Print styles for receipt */
      @media print {
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        body {
          background: white;
        }
      }
      .print-only {
        display: none;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
          "recharts": "https://aistudiocdn.com/recharts@^3.5.0"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-gray-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
